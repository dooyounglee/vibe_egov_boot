# 어댑터 통합 테스트용: H2(Oracle 모드)에 운영 DDL(db/ddl)을 적용하고 엔티티와의 일치 여부를 검증한다
spring:
  datasource:
    # 슬라이스 테스트마다 컨텍스트가 따로 뜨므로 DB 이름을 분리해 DDL이 중복 실행되지 않게 한다
    url: jdbc:h2:mem:${random.uuid};MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/ddl/*.sql
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: kr.go.agency.portal.adapter.out.persistence.OracleCompatibleH2Dialect
        jdbc:
          time_zone: Asia/Seoul

# bootstrap/application.yml 과 같은 설정
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    jdbc-type-for-null: "NULL"
